databases:
  - name: conversormoedas-db
    plan: free
    databaseName: conversormoedas
    user: conversormoedas

services:
  - type: web
    name: conversormoedas-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conversormoedas-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://conversormoedas-app.onrender.com
      - key: AWESOMEAPI_KEY
        sync: false

  - type: web
    runtime: static
    name: conversormoedas-app
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://conversormoedas-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
